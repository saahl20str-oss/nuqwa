<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نقوة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="nq.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>
<header id="hd"></header><main class="w" id="app" style="padding:30px 16px;max-width:760px"></main><footer id="ft"></footer>
<script src="config.js"></script><script src="nq.js"></script>
<script>
const P={
about:['عن نقوة',`<p>نقوة موقع عربي يعرض منتجات مختارة من أمازون الإمارات ونون. لا نبيع ولا نشحن؛ عند الضغط على زر المنتج تنتقل إلى المتجر لإتمام الشراء والدفع والتوصيل.</p><p>نحصل على عمولة عند الشراء عبر روابطنا دون أي تكلفة إضافية عليك. لا نكتب تقييمات أو تجارب لمنتجات لم نجرّبها، ولا نعرض سعرًا إلا إذا كان لدينا مصدر موثوق له.</p>`],
privacy:['سياسة الخصوصية',`<p>نسجّل زيارات مجهولة الهوية (مسار الصفحة والوقت) وعدد النقرات على روابط المتاجر لتحسين الاختيارات. لا نجمع اسمك أو بريدك أو بيانات الدفع.</p><p>نحفظ قائمة المفضلة في متصفحك فقط. عند انتقالك إلى أمازون أو نون تنطبق سياسة الخصوصية الخاصة بهما، وقد تضع روابطهما ملفات تعريف ارتباط لتتبع العمولة.</p><p>للاستفسار: <span id="em"></span></p>`],
contact:['تواصل معنا',`<p>لأي اقتراح أو ملاحظة أو بلاغ عن منتج، راسلنا على: <a id="em2"></a></p>`]};
const k=new URLSearchParams(location.search).get('p');const [t,h]=P[k]||P.about;document.title=t+' | نقوة';
$('#app').innerHTML=`<h1>${t}</h1>${h}`;
['em','em2'].forEach(i=>{const e=document.getElementById(i);if(e){e.textContent=CFG.contactEmail;if(e.tagName=='A')e.href='mailto:'+CFG.contactEmail}});
</script></body></html>
